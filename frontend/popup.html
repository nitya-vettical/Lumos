<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Lumos</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            width: 320px;
            margin: 0;
            padding: 20px;
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #1e1e24, #2a2a35);
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-sizing: border-box;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
        }

        .header h1 {
            font-size: 24px;
            margin: 0;
            font-weight: 600;
            background: -webkit-linear-gradient(45deg, #00f2fe, #4facfe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .header p {
            font-size: 12px;
            color: #a0a0b0;
            margin: 5px 0 0 0;
        }

        .controls {
            display: flex;
            flex-direction: column;
            width: 100%;
            gap: 12px;
        }

        button {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            color: #fff;
            padding: 12px;
            font-size: 14px;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(5px);
        }

        button:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.2);
            transform: translateY(-1px);
        }

        button.active {
            background: rgba(79, 172, 254, 0.15);
            border-color: #4facfe;
            box-shadow: 0 0 10px rgba(79, 172, 254, 0.2);
        }

        .reset-btn {
            margin-top: 10px;
            background: rgba(255, 75, 75, 0.1);
            border-color: rgba(255, 75, 75, 0.3);
            color: #ff6b6b;
        }

        .reset-btn:hover {
            background: rgba(255, 75, 75, 0.2);
            border-color: rgba(255, 75, 75, 0.5);
        }

        .footer {
            margin-top: 24px;
            font-size: 11px;
            color: #707080;
            text-align: center;
        }
        .footer a {
            color: #4facfe;
            text-decoration: none;
        }
        .footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>Lumos</h1>
        <p>Color Accessibility Helper</p>
    </div>

    <div class="controls">
        <button id="protanopia">Protanopia</button>
        <button id="deuteranopia">Deuteranopia</button>
        <button id="tritanopia">Tritanopia</button>
        <button id="achromatopsia">Grayscale</button>
        <button id="reset" class="reset-btn">Turn Off</button>
    </div>

    <div class="footer">
        Learn more about <a href="https://wearecolorblind.com/" target="_blank">Color Blindness</a>
    </div>

    <script src="popup.js"></script>
</body>
</html>
